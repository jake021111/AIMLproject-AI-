# AI Hub 데이터셋과 COCO 2017을 insight 15-class 체계로 통합하는 매핑 테이블.
# (CLAUDE.md §7.1: 두 출처의 taxonomy가 다르므로 먼저 통합 매핑을 만든다)
#
# 소스 선정 근거 (2026-09-20 조사):
#   - AI Hub "인도(人道)보행 영상"(dataSetSn=189)은 실외 보도 전용 데이터라 제외했다.
#     chair/table/kiosk 클래스명이 겹치지만 실제로는 길거리 벤치·가로 탁자·옥외 키오스크라
#     배경/조명/카메라 각도가 실내 매장·역사 환경과 달라 도메인 불일치를 일으킨다.
#   - AI Hub "베리어프리존(장애물 없는 생활공간) 주행영상"(dataSetSn=186)만 채택한다.
#     "노면정보"(실외 인도 상태)와 "공간정보"(실내 공간) 두 서브셋으로 나뉘는데,
#     그중 공간정보 서브셋만 쓴다. 이미 YOLOv5 bbox 포맷.
#
# ⚠️ aihub 섹션의 key는 AI Hub 데이터셋 소개 페이지에 공개된 명칭을 기준으로 적어둔 추정값이다.
#    실제 라벨 JSON/XML을 열어 정확한 category name 문자열(공백, 영문 키 등)을 확인하고
#    다르면 교체해야 한다 (CLAUDE.md §13 규칙 5 — 모르면 추측하지 않는다).

target_classes:
  0: chair
  1: table
  2: pillar
  3: trash_can
  4: signage_stand
  5: person
  6: stairs
  7: escalator
  8: elevator_door
  9: door
  10: automatic_door
  11: kiosk
  12: counter
  13: vending_machine
  14: tactile_paving

# COCO 2017 (80-class, ultralytics 0-index) → insight target class
# 실제 겹치는 클래스는 이 3개뿐이다 (CLAUDE.md §15.3). table은 AI Hub 소스가 없어 COCO 단독 의존.
coco:
  0: person   # COCO 'person'       -> person
  56: chair   # COCO 'chair'        -> chair
  60: table   # COCO 'dining table' -> table

# AI Hub 186 "베리어프리존 주행영상" - 공간정보(실내) 서브셋 매핑
# ⚠️ 데이터 다운로드 후 실제 라벨 파일의 정확한 category name으로 검증/교체할 것
aihub_186_indoor:
  "의자": chair          # 데이터셋 소개상 '휴게의자'
  "기둥": pillar
  "휴지통": trash_can
  "안내표지판": signage_stand
  "계단": stairs
  "승강기": elevator_door
  "문": door
  "판매기": vending_machine
  "점자블록": tactile_paving
  # "점자표지판", "손잡이", "벽", "창문"은 15-class 체계에 없어 매핑하지 않음 (무시)

# 아직 확보한 데이터 소스가 없는 클래스 (CLAUDE.md §14 리스크 항목).
# AI Hub에 전용 데이터셋을 찾지 못했다 — 직접 촬영 + 수동 라벨링으로 보강 예정.
unresolved_classes:
  - escalator
  - automatic_door   # 일반 door와 구분되는 전용 데이터 없음
  - kiosk            # 189 제외 후 다시 공백
  - counter
